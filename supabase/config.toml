# Config Supabase CLI — introduite avec le module Advertising (aucun
# config.toml n'existait avant dans ce projet).
#
# verify_jwt = false est indispensable pour les webhooks providers
# (Stripe/Flutterwave/PayUnit n'envoient pas de JWT Supabase — leur
# authentification propre, vérifiée dans le code de chaque fonction, en
# tient lieu : signature Stripe, verif-hash Flutterwave, revérification
# serveur PayUnit).
#
# Les fonctions appelées par un vendeur connecté gardent verify_jwt = true
# (comportement par défaut) pour que Supabase rejette toute requête sans
# session valide avant même d'exécuter le code.

[functions.ads-create-payment]
verify_jwt = true

[functions.ads-cancel-campaign]
verify_jwt = true

[functions.ads-refund-campaign]
verify_jwt = true

[functions.ads-webhook-stripe]
verify_jwt = false

[functions.ads-webhook-flutterwave]
verify_jwt = false

[functions.ads-webhook-payunit]
verify_jwt = false

[functions.ads-expire-campaigns]
verify_jwt = false

# ---- Added this audit pass: these functions existed in code but had no
# config.toml entry, meaning Supabase would default to verify_jwt = true —
# which silently breaks guest checkout (digital-download, notify-new-order
# must work for buyers with no account) and every external PSP webhook
# (Stripe/Flutterwave/PayUnit/Paddle cannot send a Supabase JWT at all).

[functions.digital-download]
verify_jwt = false

[functions.notify-new-order]
verify_jwt = false

[functions.subscription-create-payment]
verify_jwt = true

[functions.subscription-webhook-stripe]
verify_jwt = false

[functions.subscription-webhook-flutterwave]
verify_jwt = false

[functions.subscription-webhook-payunit]
verify_jwt = false

[functions.subscription-webhook-paddle]
verify_jwt = false

[functions.sitemap-products]
verify_jwt = false

# ---- Real vendor PSP checkout (audit pass: "les PSP doivent être vrai") ----
[functions.vendor-checkout-create-payment]
verify_jwt = false

[functions.vendor-checkout-webhook-stripe]
verify_jwt = false

[functions.vendor-checkout-webhook-flutterwave]
verify_jwt = false

[functions.vendor-checkout-webhook-payunit]
verify_jwt = false

[functions.vendor-checkout-webhook-paddle]
verify_jwt = false

[functions.vendor-checkout-webhook-paystack]
verify_jwt = false

[functions.cleanup-stale-orders]
verify_jwt = false

[functions.notify-seller-status-change]
verify_jwt = true
